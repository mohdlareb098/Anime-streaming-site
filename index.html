<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeVerse</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:white;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  height:72px;
  background:#050505;
  border-bottom:1px solid #063f47;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
}

.logo{
  color:#00e5ff;
  font-size:34px;
  font-weight:bold;
  text-shadow:0 0 15px #00e5ff;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:17px;
}

nav a:hover{
  color:#00e5ff;
}

/* HERO */
.hero{
  min-height:390px;
  padding:70px 6%;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 80% 40%,#004d55,transparent 35%),
    linear-gradient(135deg,#000,#00191d);
}

.hero-content{
  max-width:650px;
}

.hero h1{
  font-size:55px;
  margin-bottom:15px;
}

.hero h1 span{
  color:#00e5ff;
}

.hero p{
  color:#aaa;
  font-size:19px;
  line-height:1.6;
  margin-bottom:25px;
}

.btn{
  border:none;
  background:#00e5ff;
  color:#000;
  padding:14px 24px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  box-shadow:0 0 20px #00e5ff;
}

/* MAIN */
.container{
  width:88%;
  max-width:1200px;
  margin:auto;
  padding:35px 0;
}

.section-title{
  font-size:30px;
  margin-bottom:20px;
}

.section-title span{
  color:#00e5ff;
}

/* SEARCH */
.search-box{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.search-box input{
  width:100%;
  padding:15px;
  background:#071014;
  border:1px solid #064954;
  border-radius:10px;
  color:white;
  outline:none;
  font-size:16px;
}

.search-box input:focus{
  border-color:#00e5ff;
  box-shadow:0 0 10px #003d44;
}

/* GENRES */
.genres{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:15px;
  margin-bottom:25px;
}

.genre{
  white-space:nowrap;
  padding:11px 22px;
  border:1px solid #07515b;
  border-radius:25px;
  background:#05090a;
  color:#aaa;
  cursor:pointer;
}

.genre:hover,
.genre.active{
  background:#00e5ff;
  color:#000;
  border-color:#00e5ff;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  background:#080808;
  border:1px solid #073e46;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#00e5ff;
  box-shadow:0 0 20px #003f47;
}

.poster{
  height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  background:linear-gradient(135deg,#06353b,#00aebe);
}

.card-info{
  padding:15px;
}

.card h3{
  font-size:20px;
  margin-bottom:8px;
}

.meta{
  color:#999;
  font-size:14px;
  margin-bottom:8px;
}

.rating{
  color:#00e5ff;
  font-weight:bold;
}

/* DETAILS */
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.9);
  padding:20px;
  overflow:auto;
}

.modal-box{
  max-width:750px;
  margin:50px auto;
  background:#080808;
  border:1px solid #00e5ff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 0 30px #003f47;
}

.close{
  float:right;
  font-size:30px;
  cursor:pointer;
  color:#00e5ff;
}

.detail-poster{
  height:220px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:80px;
  background:linear-gradient(135deg,#06353b,#00aebe);
  border-radius:12px;
  margin-bottom:20px;
}

.modal h2{
  font-size:30px;
  margin-bottom:10px;
  color:#00e5ff;
}

.description{
  color:#aaa;
  line-height:1.6;
  margin:15px 0;
}

/* EPISODES */
.episodes{
  margin-top:25px;
}

.episodes h3{
  margin-bottom:15px;
  color:#00e5ff;
}

.episode-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.episode-list button{
  background:#071014;
  color:#00e5ff;
  border:1px solid #00e5ff;
  border-radius:10px;
  padding:12px 17px;
  cursor:pointer;
}

.episode-list button:hover{
  background:#00e5ff;
  color:#000;
}

/* PLAYER */
.player{
  display:none;
  position:fixed;
  inset:0;
  z-index:3000;
  background:#000;
  padding:15px;
}

.player video{
  width:100%;
  height:75vh;
  background:#050505;
  margin-top:40px;
}

.player-close{
  position:absolute;
  top:12px;
  right:20px;
  font-size:30px;
  color:#00e5ff;
  cursor:pointer;
}

/* FOOTER */
footer{
  margin-top:50px;
  padding:30px;
  text-align:center;
  border-top:1px solid #073e46;
  color:#777;
}

footer span{
  color:#00e5ff;
}

/* MOBILE */
@media(max-width:800px){
  .logo{
    font-size:26px;
  }

  nav{
    gap:12px;
  }

  nav a{
    font-size:14px;
  }

  .hero{
    min-height:330px;
    padding:50px 6%;
  }

  .hero h1{
    font-size:40px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .poster{
    height:190px;
    font-size:55px;
  }

  .card h3{
    font-size:17px;
  }

  .container{
    width:92%;
  }

  .player video{
    height:55vh;
  }
}

@media(max-width:450px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .poster{
    height:170px;
  }

  .hero h1{
    font-size:35px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">AnimeVerse</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#anime">Anime</a>
    <a href="#genres">Genres</a>
  </nav>
</header>


<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-content">
    <h1>Watch <span>Anime</span></h1>

    <p>
      Discover amazing anime, explore new worlds
      and find your next favourite series.
    </p>

    <button class="btn" onclick="scrollToAnime()">
      Explore Anime
    </button>
  </div>
</section>


<!-- ANIME -->
<main class="container" id="anime">

  <h2 class="section-title">
    🔥 <span>Popular Anime</span>
  </h2>

  <!-- SEARCH -->
  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="Search anime..."
      oninput="searchAnime()"
    >
  </div>


  <!-- GENRES -->
  <div class="genres" id="genres">

    <button class="genre active"
      onclick="filterGenre('All',this)">
      All
    </button>

    <button class="genre"
      onclick="filterGenre('Action',this)">
      Action
    </button>

    <button class="genre"
      onclick="filterGenre('Adventure',this)">
      Adventure
    </button>

    <button class="genre"
      onclick="filterGenre('Fantasy',this)">
      Fantasy
    </button>

    <button class="genre"
      onclick="filterGenre('Comedy',this)">
      Comedy
    </button>

    <button class="genre"
      onclick="filterGenre('Sci-Fi',this)">
      Sci-Fi
    </button>

  </div>


  <!-- CARDS -->
  <div class="grid" id="animeGrid"></div>

</main>


<!-- DETAILS MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">

    <span class="close" onclick="closeModal()">×</span>

    <div class="detail-poster" id="detailPoster">
      ⚔️
    </div>

    <h2 id="detailTitle">Anime</h2>

    <div class="meta" id="detailGenre">
      Action • Adventure
    </div>

    <div class="rating" id="detailRating">
      ★ 9.0
    </div>

    <p class="description" id="detailDescription">
      Anime description.
    </p>

    <div class="episodes">

      <h3>Episodes</h3>

      <div class="episode-list" id="episodeList"></div>

    </div>

  </div>

</div>


<!-- VIDEO PLAYER -->
<div class="player" id="player">

  <span class="player-close" onclick="closePlayer()">×</span>

  <video id="videoPlayer" controls>
    <source
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      type="video/mp4"
    >
    Your browser does not support video.
  </video>

</div>


<!-- FOOTER -->
<footer>
  © 2026 <span>AnimeVerse</span> • Built with ❤️
</footer>


<script>

/* ANIME DATA */

const animeData = [

  {
    title:"Shadow Warriors",
    genre:"Action",
    genres:"Action • Adventure",
    rating:"9.2",
    icon:"⚔️",
    description:
    "A group of young warriors begin an exciting journey filled with battles, friendship and adventure."
  },

  {
    title:"Sky Legends",
    genre:"Fantasy",
    genres:"Fantasy • Action",
    rating:"8.9",
    icon:"⚡",
    description:
    "A fantasy adventure where heroes discover mysterious powers and legendary worlds."
  },

  {
    title:"Flame Hero",
    genre:"Action",
    genres:"Action • Fantasy",
    rating:"9.0",
    icon:"🔥",
    description:
    "A young hero learns to control an incredible power while protecting his friends."
  },

  {
    title:"Moon Hunter",
    genre:"Adventure",
    genres:"Adventure • Fantasy",
    rating:"8.7",
    icon:"🌙",
    description:
    "An adventurous journey through mysterious lands under the light of the moon."
  },

  {
    title:"Galaxy Force",
    genre:"Sci-Fi",
    genres:"Sci-Fi • Action",
    rating:"9.1",
    icon:"🚀",
    description:
    "A futuristic team travels across the galaxy to protect distant worlds."
  },

  {
    title:"Funny Academy",
    genre:"Comedy",
    genres:"Comedy • School",
    rating:"8.5",
    icon:"😂",
    description:
    "A group of students experience hilarious adventures at a very unusual academy."
  },

  {
    title:"Dragon Realm",
    genre:"Fantasy",
    genres:"Fantasy • Adventure",
    rating:"9.3",
    icon:"🐉",
    description:
    "Heroes enter a magical realm where ancient dragons and powerful mysteries await."
  },

  {
    title:"Night Blade",
    genre:"Action",
    genres:"Action • Fantasy",
    rating:"9.0",
    icon:"🗡️",
    description:
    "A mysterious swordsman fights powerful enemies while uncovering his hidden past."
  }

];

let currentAnime = null;


/* SHOW ANIME */

function showAnime(list = animeData){

  const grid = document.getElementById("animeGrid");

  grid.innerHTML = "";

  if(list.length === 0){

    grid.innerHTML =
    "<p style='color:#aaa'>No anime found.</p>";

    return;
  }

  list.forEach((anime,index)=>{

    const card = document.createElement("div");

    card.className = "card";

    card.onclick = () => openAnime(index,list);

    card.innerHTML = `

      <div class="poster">
        ${anime.icon}
      </div>

      <div class="card-info">

        <h3>${anime.title}</h3>

        <div class="meta">
          ${anime.genres}
        </div>

        <div class="rating">
          ★ ${anime.rating}
        </div>

      </div>

    `;

    grid.appendChild(card);

  });

}


/* OPEN ANIME */

function openAnime(index,list){

  currentAnime = list[index];

  document.getElementById("detailTitle")
    .textContent = currentAnime.title;

  document.getElementById("detailGenre")
    .textContent = currentAnime.genres;

  document.getElementById("detailRating")
    .textContent = "★ " + currentAnime.rating;

  document.getElementById("detailDescription")
    .textContent = currentAnime.description;

  document.getElementById("detailPoster")
    .textContent = currentAnime.icon;

  createEpisodes();

  document.getElementById("modal").style.display = "block";

}


/* EPISODES */

function createEpisodes(){

  const list = document.getElementById("episodeList");

  list.innerHTML = "";

  for(let i=1;i<=12;i++){

    const button = document.createElement("button");

    button.textContent = "Episode " + i;

    button.onclick = () => playEpisode(i);

    list.appendChild(button);

  }

}


/* PLAY EPISODE */

function playEpisode(number){

  document.getElementById("modal").style.display = "none";

  const player = document.getElementById("player");

  const video = document.getElementById("videoPlayer");

  player.style.display = "block";

  /*
    IMPORTANT:
    Replace the demo video URL above with a video
    that you have permission to stream.
  */

  video.play().catch(()=>{});

}


/* CLOSE PLAYER */

function closePlayer(){

  const player = document.getElementById("player");

  const video = document.getElementById("videoPlayer");

  video.pause();

  player.style.display = "none";

}


/* CLOSE MODAL */

function closeModal(){

  document.getElementById("modal").style.display = "none";

}


/* SEARCH */

function searchAnime(){

  const query =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const results = animeData.filter(anime =>
    anime.title.toLowerCase().includes(query) ||
    anime.genre.toLowerCase().includes(query) ||
    anime.genres.toLowerCase().includes(query)
  );

  showAnime(results);

}


/* GENRE FILTER */

function filterGenre(genre,button){

  document.querySelectorAll(".genre")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  if(genre === "All"){

    showAnime(animeData);

    return;
  }

  const results = animeData.filter(anime =>
    anime.genres.includes(genre)
  );

  showAnime(results);

}


/* SCROLL */

function scrollToAnime(){

  document.getElementById("anime")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* START */

showAnime(animeData);

</script>

</body>
</html>
