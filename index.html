<title>AnimeVerse</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;

body{

}

header{
  position:sticky;
  top:0;
  z-index:100;
  height:70px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(12,12,12,.96);

}

.logo{
  font-size:26px;
  font-weight:800;
  color:#ff2f7d;
}

nav{
  display:flex;
  gap:25px;
}

  font-size:15px;
}

nav a:hover{
  color:#ff2f7d;
}
